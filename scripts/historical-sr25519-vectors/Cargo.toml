[package]
name = "historical-sr25519-vectors"
version = "0.1.0"
edition = "2018"
publish = false

# The native dependency pins of the sr25519 JNI library that every SORA Wallet release shipped:
# fearless-utils `sr25519-java` (schnorrkel <= 0.9.1, zeroize <= 1.1.1) and x-crypto 1.2.7
# (vendor/soramitsu-maven/build-inputs/xcrypto-1.2.7-Cargo.lock: schnorrkel 0.9.1,
# curve25519-dalek 2.1.3, merlin 2.0.1, sha2 0.8.2, zeroize 1.1.1).
[dependencies]
schnorrkel = { version = "=0.9.1" }
curve25519-dalek = { version = "=4.1.3" }
merlin = { version = "=2.0.1" }
sha2 = { version = "=0.8.2" }
zeroize = { version = "=1.1.1" }
rand = { version = "=0.7.3" }

[workspace]
