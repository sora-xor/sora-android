[package]
name = "sora-native-security-regression"
version = "0.1.0"
edition = "2018"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
curve25519-dalek = { version = "=2.1.3", default-features = false, features = ["std"] }
rand = { version = "=0.7.3", features = ["log"] }
log = "=0.4.33"

[features]
u64_backend = ["curve25519-dalek/u64_backend"]
u32_backend = ["curve25519-dalek/u32_backend"]
