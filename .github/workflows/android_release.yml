name: Android Release

# Builds the signed, minified productionRelease AAB and APK in one job, checks them, and
# uploads them as a workflow artifact. Nothing is published to Google Play from here; the
# release manager uploads the AAB by hand (see docs/release-3.9.0/RELEASE-CHECKLIST.md).
#
# Required secrets (store them in the "production" environment):
#   CI_KEYSTORE_BASE64      base64 of the upload keystore (Jenkins credential android_keystore_sora)
#   CI_KEYSTORE_PASS        keystore password
#   CI_KEYSTORE_KEY_ALIAS   key alias
#   CI_KEYSTORE_KEY_PASS    key password
#   SORA_GOOGLE_TOKEN_PROD  Google Drive backup OAuth client; must be the same client as 3.8.6.3
#   GOOGLE_SERVICES_JSON    base64 of app/google-services.json for jp.co.soramitsu.sora
# Version code: the version_code input, else the SORA_VERSION_CODE variable or secret.
# Version name: the version_name input, or the tag name after "android/v". The built APK must
# carry exactly that versionName, so a release commit without the version bump fails.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Play versionCode (digits only, higher than every code already uploaded; 3.9.0: 3090001)"
        required: false
        type: string
      version_name:
        description: "Expected versionName of the build, for example 3.9.0"
        required: true
        type: string
  push:
    # A tag push uses the workflow file at the tagged commit, so it also works before this
    # file reaches the default branch. Tag builds take the version code from SORA_VERSION_CODE
    # and the version name from the tag (android/v3.9.0 expects versionName 3.9.0).
    tags:
      - "android/v*"

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Signed productionRelease AAB and APK
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 150
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      GRADLE_FLAGS: --dependency-verification=strict --stacktrace
      SORA_VERSION_CODE: ${{ inputs.version_code || vars.SORA_VERSION_CODE || secrets.SORA_VERSION_CODE }}
      # The 3.8.6.3 release on Google Play uses versionCode 122.
      MINIMUM_VERSION_CODE: "123"
      AAB_PATH: app/build/outputs/bundle/productionRelease/app-production-release.aab
      APK_PATH: app/build/outputs/apk/production/release/app-production-release.apk
      MAPPING_PATH: app/build/outputs/mapping/productionRelease/mapping.txt
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          # Release builds never reuse caches written by other workflow runs.
          cache-disabled: true

      - name: Check release inputs
        shell: bash
        env:
          CI_KEYSTORE_BASE64: ${{ secrets.CI_KEYSTORE_BASE64 }}
          CI_KEYSTORE_PASS: ${{ secrets.CI_KEYSTORE_PASS }}
          CI_KEYSTORE_KEY_ALIAS: ${{ secrets.CI_KEYSTORE_KEY_ALIAS }}
          CI_KEYSTORE_KEY_PASS: ${{ secrets.CI_KEYSTORE_KEY_PASS }}
          SORA_GOOGLE_TOKEN_PROD: ${{ secrets.SORA_GOOGLE_TOKEN_PROD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          VERSION_NAME_INPUT: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          missing=()
          for name in CI_KEYSTORE_BASE64 CI_KEYSTORE_PASS CI_KEYSTORE_KEY_ALIAS CI_KEYSTORE_KEY_PASS \
                      SORA_GOOGLE_TOKEN_PROD GOOGLE_SERVICES_JSON; do
            [[ -n "${!name//[[:space:]]/}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing release secrets: ${missing[*]}"
            exit 1
          fi
          if [[ ! "$SORA_VERSION_CODE" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "::error::Set the version_code input (or the SORA_VERSION_CODE variable) to a positive whole number."
            exit 1
          fi
          if (( SORA_VERSION_CODE < MINIMUM_VERSION_CODE )); then
            echo "::error::Version code $SORA_VERSION_CODE is not higher than the live 3.8.6.3 code (122)."
            exit 1
          fi
          expected_version_name="$VERSION_NAME_INPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag_version_name="${GITHUB_REF_NAME#android/v}"
            if [[ -n "$expected_version_name" && "$expected_version_name" != "$tag_version_name" ]]; then
              echo "::error::version_name $expected_version_name does not match the tag $GITHUB_REF_NAME."
              exit 1
            fi
            expected_version_name="$tag_version_name"
          fi
          if [[ ! "$expected_version_name" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::Set the version_name input (for example 3.9.0), or push a tag named android/v<versionName>."
            exit 1
          fi
          # Fail before the long build when the source still has another version name. The
          # APK check after the build is the authoritative one.
          source_version_name=""
          while IFS= read -r line; do
            if [[ "$line" =~ ^val\ appVersionName\ =\ \"([^\"]*)\"$ ]]; then
              source_version_name="${BASH_REMATCH[1]}"
              break
            fi
          done < app/build.gradle.kts
          if [[ -n "$source_version_name" && "$source_version_name" != "$expected_version_name" ]]; then
            echo "::error::app/build.gradle.kts has versionName $source_version_name, but this run expects $expected_version_name."
            exit 1
          fi
          echo "EXPECTED_VERSION_NAME=$expected_version_name" >> "$GITHUB_ENV"
          echo "Release inputs are present. versionName=$expected_version_name versionCode=$SORA_VERSION_CODE"

      - name: Write upload keystore
        shell: bash
        env:
          CI_KEYSTORE_BASE64: ${{ secrets.CI_KEYSTORE_BASE64 }}
          CI_KEYSTORE_PASS: ${{ secrets.CI_KEYSTORE_PASS }}
          CI_KEYSTORE_KEY_ALIAS: ${{ secrets.CI_KEYSTORE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/sora-upload.keystore"
          rm -f "$keystore"
          printf '%s' "$CI_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"
          # Fails early, with a clear message, when the password or alias is wrong.
          if ! "$JAVA_HOME/bin/keytool" -list -keystore "$keystore" -storepass:env CI_KEYSTORE_PASS \
              -alias "$CI_KEYSTORE_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::CI_KEYSTORE_PASS does not open the keystore, or it has no key named CI_KEYSTORE_KEY_ALIAS."
            exit 1
          fi
          echo "CI_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Write google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d ' \r\n' | base64 --decode > app/google-services.json
          python3 -I - app/google-services.json <<'EOF'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          packages = {
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in data.get("client", [])
          }
          if "jp.co.soramitsu.sora" not in packages:
              sys.exit("google-services.json has no client for jp.co.soramitsu.sora")
          print("google-services.json is valid for jp.co.soramitsu.sora")
          EOF

      - name: Unit tests
        run: ./gradlew $GRADLE_FLAGS testProductionDebugUnitTest

      - name: Lint (report only)
        # android_ci.yml enforces this lint on pull requests. Here it only produces the report
        # for the release manager; assembleProductionRelease still runs AGP's blocking
        # lintVital checks for the release build.
        id: lint
        continue-on-error: true
        run: ./gradlew $GRADLE_FLAGS :app:lintProductionDebug

      - name: Warn about lint findings
        if: steps.lint.outcome == 'failure'
        run: echo "::warning::lintProductionDebug failed. Read the lint report in the release artifact before uploading to Google Play."

      - name: Build signed productionRelease AAB and APK
        env:
          CI_KEYSTORE_PASS: ${{ secrets.CI_KEYSTORE_PASS }}
          CI_KEYSTORE_KEY_ALIAS: ${{ secrets.CI_KEYSTORE_KEY_ALIAS }}
          CI_KEYSTORE_KEY_PASS: ${{ secrets.CI_KEYSTORE_KEY_PASS }}
          SORA_GOOGLE_TOKEN_PROD: ${{ secrets.SORA_GOOGLE_TOKEN_PROD }}
        run: |
          # CI_BUILD_ID mirrors SORA_VERSION_CODE for build scripts that still read the old name.
          export CI_BUILD_ID="$SORA_VERSION_CODE"
          ./gradlew $GRADLE_FLAGS \
            :app:verifyProductionReleaseSigning \
            :app:assembleProductionRelease \
            :app:bundleProductionRelease

      - name: Check package name and version
        shell: bash
        run: |
          set -euo pipefail
          for artifact in "$AAB_PATH" "$APK_PATH" "$MAPPING_PATH"; do
            [[ -s "$artifact" && ! -L "$artifact" ]] || { echo "::error::Missing $artifact"; exit 1; }
          done
          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK_PATH")"
          package_line="$(grep -m 1 '^package:' <<< "$badging")"
          echo "$package_line"
          [[ "$package_line" == *"name='jp.co.soramitsu.sora'"* ]] || {
            echo "::error::Unexpected package name"; exit 1; }
          [[ "$package_line" == *"versionCode='$SORA_VERSION_CODE'"* ]] || {
            echo "::error::APK versionCode does not match $SORA_VERSION_CODE"; exit 1; }
          [[ "$package_line" == *"versionName='$EXPECTED_VERSION_NAME'"* ]] || {
            echo "::error::APK versionName is not $EXPECTED_VERSION_NAME"; exit 1; }

      - name: Check signing certificate against the pinned upload certificate
        run: python3 scripts/verify-release-signing.py "$AAB_PATH" "$APK_PATH"

      - name: Check 16 KB native page alignment
        run: |
          python3 scripts/verify-android-native-16kb.py "$AAB_PATH"
          python3 scripts/verify-android-native-16kb.py "$APK_PATH"

      - name: Record checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "$AAB_PATH" "$APK_PATH" "$MAPPING_PATH" | tee SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sora-android-release-${{ env.EXPECTED_VERSION_NAME }}-${{ env.SORA_VERSION_CODE }}
          path: |
            app/build/outputs/bundle/productionRelease/app-production-release.aab
            app/build/outputs/apk/production/release/app-production-release.apk
            app/build/outputs/mapping/productionRelease/mapping.txt
            app/build/reports/lint-results-productionDebug.html
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Remove keystore and google-services.json
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/sora-upload.keystore" app/google-services.json
