name: Android Upgrade Device Tests

# Runs the wallet-upgrade device tests on an emulator: storage, Room migrations, the upgrade
# scenarios written with the storage code of the released apps, the recovery screens, the
# sr25519 known-answer test, and the two suites that restart the process between phases.
# Needs no secrets.
#
# It runs
#   - for every push to a release/** branch (release candidates),
#   - as the first job of "Android Release" (android_release.yml), which does not build a
#     signed artifact unless these tests passed on the same commit,
#   - on demand from the Actions tab, also with another system image, for example the
#     Android 16 image with 16 KB pages.
#
# The same tests run on a machine without network access with
#   scripts/run-production-connected-device-qualification.sh --offline
on:
  workflow_call:
    inputs:
      system_image:
        description: "SDK package of the emulator system image (x86_64)"
        required: false
        type: string
        default: "system-images;android-34;google_atd;x86_64"
  workflow_dispatch:
    inputs:
      system_image:
        description: "Emulator system image (x86_64), e.g. system-images;android-36;google_apis_ps16k;x86_64 for Android 16 with 16 KB pages"
        required: false
        type: string
        default: "system-images;android-34;google_atd;x86_64"
  push:
    branches:
      - "release/**"

permissions:
  contents: read

jobs:
  upgrade-device-tests:
    name: Wallet upgrade device tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      # Read by the device-test scripts and passed to every Gradle call.
      SORA_GRADLE_FLAGS: --dependency-verification=strict
      # Empty for a push, which has no inputs.
      SYSTEM_IMAGE: ${{ inputs.system_image || 'system-images;android-34;google_atd;x86_64' }}
      EMULATOR_PORT: "5554"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Check the system image name
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SYSTEM_IMAGE" =~ ^system-images\;android-[0-9A-Za-z.]+\;[a-z0-9_]+\;x86_64$ ]]; then
            echo "::error::system_image must look like system-images;android-34;google_atd;x86_64"
            exit 1
          fi

      - name: Let the emulator use hardware acceleration (KVM)
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the emulator
        shell: bash
        run: |
          bash scripts/start-emulator-for-device-tests.sh \
            --avd sora-upgrade-device-tests \
            --create "$SYSTEM_IMAGE" --install-image \
            --port "$EMULATOR_PORT" \
            --log build/device-qualification/emulator.log

      - name: Wallet upgrade device tests
        # ANDROID_SERIAL was set by the step above. The script stops on anything that is not
        # an emulator.
        run: bash scripts/run-production-connected-device-qualification.sh --report-dir build/device-qualification

      - name: Show the summary
        if: always()
        shell: bash
        run: |
          if [[ -f build/device-qualification/summary.txt ]]; then
            {
              echo '```'
              cat build/device-qualification/summary.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The device tests did not get as far as writing a summary." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the device test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Keep this with the release record: it names the commit and the device.
          name: wallet-upgrade-device-tests-${{ github.sha }}
          path: |
            build/device-qualification/
            **/build/reports/androidTests/connected/
            **/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 90

      - name: Stop the emulator
        if: always()
        shell: bash
        run: adb -s "emulator-$EMULATOR_PORT" emu kill || true
