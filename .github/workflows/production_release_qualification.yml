name: Production Release Qualification

on:
  workflow_dispatch:
    inputs:
      rollout_target_percent:
        description: "Leave empty for candidate qualification; set only to 1, 5, 25, or 100 for an explicitly authorized rollout gate"
        required: false
        type: string
      candidate_run_id:
        description: "Required for rollout gates: workflow run containing the immutable qualified-candidate artifact"
        required: false
        type: string

concurrency:
  group: production-release-qualification
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 240
    env:
      CI: "true"
      CI_BUILD_ID: ${{ vars.PRODUCTION_VERSION_CODE }}
      PRODUCTION_ROLLOUT_TARGET_PERCENT: ${{ inputs.rollout_target_percent }}
      PRODUCTION_CANDIDATE_AAB_PATH: ${{ github.workspace }}/app/build/outputs/bundle/productionRelease/app-production-release.aab
      PRODUCTION_CANDIDATE_SOURCE_REVISION: ${{ github.sha }}
      PRODUCTION_CANDIDATE_REPOSITORY: ${{ github.repository }}
      PRODUCTION_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      PRODUCTION_CANDIDATE_APK_PATH: ${{ github.workspace }}/app/build/outputs/apk/production/release/app-production-release.apk
      PRODUCTION_CANDIDATE_MAPPING_PATH: ${{ github.workspace }}/app/build/outputs/mapping/productionRelease/mapping.txt
      ANDROID_DEPENDENCY_SIGNING_REVIEW_PRODUCER_KEY_SHA256: ${{ vars.ANDROID_DEPENDENCY_SIGNING_REVIEW_PRODUCER_KEY_SHA256 }}
      ANDROID_DEPENDENCY_SIGNING_REVIEW_REVIEWER_KEY_SHA256: ${{ vars.ANDROID_DEPENDENCY_SIGNING_REVIEW_REVIEWER_KEY_SHA256 }}
      ANDROID_DEPENDENCY_SIGNING_REVIEW_SEQUENCE_NUMBER: ${{ vars.ANDROID_DEPENDENCY_SIGNING_REVIEW_SEQUENCE_NUMBER }}
      ANDROID_DEPENDENCY_SIGNING_REVIEW_SOURCE_REVISION: ${{ vars.ANDROID_DEPENDENCY_SIGNING_REVIEW_SOURCE_REVISION }}
      ANDROID_DEPENDENCY_SIGNING_REVIEW_CONTRACT_SHA256: ${{ vars.ANDROID_DEPENDENCY_SIGNING_REVIEW_CONTRACT_SHA256 }}
      # Independently protected retained-wallet qualification identity. These values
      # identify externally produced/reviewed evidence; this workflow never creates it.
      ANDROID_MIGRATION_QUALIFICATION_RUN_ID: ${{ vars.ANDROID_MIGRATION_QUALIFICATION_RUN_ID }}
      ANDROID_MIGRATION_QUALIFICATION_SEQUENCE_NUMBER: ${{ vars.ANDROID_MIGRATION_QUALIFICATION_SEQUENCE_NUMBER }}
      ANDROID_MIGRATION_QUALIFICATION_APP_BUILD_IDENTITY_SHA256: ${{ vars.ANDROID_MIGRATION_QUALIFICATION_APP_BUILD_IDENTITY_SHA256 }}
      ANDROID_MIGRATION_QUALIFICATION_TRUST_SHA256: ${{ vars.ANDROID_MIGRATION_QUALIFICATION_TRUST_SHA256 }}
      ANDROID_MIGRATION_QUALIFICATION_DEVICE_PRODUCER_PUBLIC_KEY_SHA256: ${{ vars.ANDROID_MIGRATION_QUALIFICATION_DEVICE_PRODUCER_PUBLIC_KEY_SHA256 }}
      ANDROID_MIGRATION_QUALIFICATION_REVIEWER_PUBLIC_KEY_SHA256: ${{ vars.ANDROID_MIGRATION_QUALIFICATION_REVIEWER_PUBLIC_KEY_SHA256 }}
      ANDROID_MIGRATION_CONTROLLER_ORIGIN: ${{ vars.ANDROID_MIGRATION_CONTROLLER_ORIGIN }}
      ANDROID_MIGRATION_CONTROLLER_TLS_SPKI_SHA256_BASE64: ${{ vars.ANDROID_MIGRATION_CONTROLLER_TLS_SPKI_SHA256_BASE64 }}
      TAIRA_DEPLOYMENT_OPERATOR_KEY_SHA256: ${{ vars.TAIRA_DEPLOYMENT_OPERATOR_KEY_SHA256 }}
      TAIRA_DEPLOYMENT_REVIEWER_KEY_SHA256: ${{ vars.TAIRA_DEPLOYMENT_REVIEWER_KEY_SHA256 }}
      # The protected controller response is written here only after the fresh PI probe;
      # repository code never fabricates or self-signs rollout evidence.
      PRODUCTION_ROLLOUT_TRUST_SHA256: ${{ vars.PRODUCTION_ROLLOUT_TRUST_SHA256 }}
      PRODUCTION_ROLLOUT_CONTROLLER_ORIGIN: ${{ vars.PRODUCTION_ROLLOUT_CONTROLLER_ORIGIN }}
      PRODUCTION_ROLLOUT_CONTROLLER_TLS_SPKI_SHA256_BASE64: ${{ vars.PRODUCTION_ROLLOUT_CONTROLLER_TLS_SPKI_SHA256_BASE64 }}
      FUNDED_CANARY_CONTROLLER_ORIGIN: ${{ vars.FUNDED_CANARY_CONTROLLER_ORIGIN }}
      FUNDED_CANARY_CONTROLLER_TLS_SPKI_SHA256_BASE64: ${{ vars.FUNDED_CANARY_CONTROLLER_TLS_SPKI_SHA256_BASE64 }}
      # Independently reviewed environment pins. Never derive either value in
      # this workflow from the checkout that they are intended to protect.
      POLKAMARKT_EXTRINSIC_REVIEW_KEY_SHA256: ${{ vars.POLKAMARKT_EXTRINSIC_REVIEW_KEY_SHA256 }}
      POLKAMARKT_EXTRINSIC_QUALIFIED_FIXTURE_SHA256: ${{ vars.POLKAMARKT_EXTRINSIC_QUALIFIED_FIXTURE_SHA256 }}
      POLKAMARKT_IOS_REPOSITORY: ${{ vars.POLKAMARKT_IOS_REPOSITORY }}
      POLKAMARKT_IOS_SOURCE_REVISION: ${{ vars.POLKAMARKT_IOS_SOURCE_REVISION }}
      POLKAMARKT_IOS_SOURCE_ROOT: ${{ github.workspace }}/.cross-platform/sora-ios
      POLKAMARKT_IOS_FIXTURE_PATH: ${{ github.workspace }}/.cross-platform/sora-ios/Fixtures/Modernization/polkamarkt-runtime-v130.json
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Initialize runner-scoped qualification paths
        run: |
          set -euo pipefail
          umask 077
          [[ "$RUNNER_TEMP" = /* && -d "$RUNNER_TEMP" && ! -L "$RUNNER_TEMP" ]] || exit 1
          [[ "$GITHUB_ENV" = /* && -f "$GITHUB_ENV" && ! -L "$GITHUB_ENV" ]] || exit 1
          append_runner_temp_path() {
            local name="$1"
            local relative_path="$2"
            [[ "$name" =~ ^[A-Z][A-Z0-9_]*$ ]] || exit 1
            [[ "$relative_path" =~ ^[A-Za-z0-9._/-]+$ && "$relative_path" != *".."* ]] || exit 1
            printf '%s=%s/%s\n' "$name" "$RUNNER_TEMP" "$relative_path" >> "$GITHUB_ENV"
          }
          append_runner_temp_path "PRODUCTION_CANDIDATE_RUN_RECEIPT_PATH" "sora-qualified-candidate-run.json"
          append_runner_temp_path "PRODUCTION_CANDIDATE_ARTIFACT_RECEIPT_PATH" "sora-qualified-candidate-artifacts.json"
          append_runner_temp_path "PI_PRODUCTION_PROBE_RECEIPT" "sora-pi-production-probe.json"
          append_runner_temp_path "PRODUCTION_CANDIDATE_PI_RECEIPT_PATH" "sora-pi-production-probe.json"
          append_runner_temp_path "PRODUCTION_QUALIFICATION_RECEIPT_PATH" "sora-production-admission.json"
          append_runner_temp_path "PRODUCTION_PRIMARY_BUILD_LOG_PATH" "sora-android-primary-build.log"
          append_runner_temp_path "PRODUCTION_PRIMARY_SIGNING_VERIFICATION_PATH" "sora-android-primary-signing-verification.json"
          append_runner_temp_path "PRODUCTION_REPRODUCED_AAB_PATH" "sora-android-reproduction/app/build/outputs/bundle/productionRelease/app-production-release.aab"
          append_runner_temp_path "PRODUCTION_REPRODUCED_APK_PATH" "sora-android-reproduction/app/build/outputs/apk/production/release/app-production-release.apk"
          append_runner_temp_path "PRODUCTION_REPRODUCED_MAPPING_PATH" "sora-android-reproduction/app/build/outputs/mapping/productionRelease/mapping.txt"
          append_runner_temp_path "PRODUCTION_REPRODUCED_BUILD_LOG_PATH" "sora-android-reproduction-build.log"
          append_runner_temp_path "PRODUCTION_REPRODUCED_SIGNING_VERIFICATION_PATH" "sora-android-reproduction-signing-verification.json"
          append_runner_temp_path "ANDROID_DEPENDENCY_SIGNING_REVIEW_MANIFEST_PATH" "sora-android-dependency-signing-review/manifest.json"
          append_runner_temp_path "ANDROID_DEPENDENCY_SIGNING_REVIEW_PRODUCER_SIGNATURE_PATH" "sora-android-dependency-signing-review/producer.sig"
          append_runner_temp_path "ANDROID_DEPENDENCY_SIGNING_REVIEW_REVIEWER_SIGNATURE_PATH" "sora-android-dependency-signing-review/reviewer.sig"
          append_runner_temp_path "ANDROID_DEPENDENCY_SIGNING_REVIEW_PRODUCER_PUBLIC_KEY_PATH" "sora-android-dependency-signing-review/producer.pem"
          append_runner_temp_path "ANDROID_DEPENDENCY_SIGNING_REVIEW_REVIEWER_PUBLIC_KEY_PATH" "sora-android-dependency-signing-review/reviewer.pem"
          append_runner_temp_path "ANDROID_DEPENDENCY_SIGNING_REVIEW_ADMISSION_PATH" "sora-android-dependency-signing-review/admission.json"
          append_runner_temp_path "ANDROID_MIGRATION_CONTROLLER_ENVELOPE_PATH" "sora-android-migration-controller-envelope-v1.json"
          append_runner_temp_path "ANDROID_MIGRATION_CONTROLLER_EVIDENCE_ROOT" "sora-android-migration-controller-evidence-v1"
          append_runner_temp_path "ANDROID_MIGRATION_CONTROLLER_EXTRACTION_RECEIPT_PATH" "sora-android-migration-controller-extraction-v1.json"
          append_runner_temp_path "TAIRA_DEPLOYMENT_MANIFEST_PATH" "sora-taira-deployment/manifest.json"
          append_runner_temp_path "TAIRA_DEPLOYMENT_OPERATOR_SIGNATURE_PATH" "sora-taira-deployment/operator.sig"
          append_runner_temp_path "TAIRA_DEPLOYMENT_REVIEWER_SIGNATURE_PATH" "sora-taira-deployment/reviewer.sig"
          append_runner_temp_path "TAIRA_DEPLOYMENT_OPERATOR_PUBLIC_KEY_PATH" "sora-taira-deployment/operator.pem"
          append_runner_temp_path "TAIRA_DEPLOYMENT_REVIEWER_PUBLIC_KEY_PATH" "sora-taira-deployment/reviewer.pem"
          append_runner_temp_path "TAIRA_DEPLOYMENT_ADMISSION_RECEIPT_PATH" "sora-taira-deployment/admission.json"
          append_runner_temp_path "PRODUCTION_ROLLOUT_EVIDENCE_PATH" "sora-production-rollout-evidence.json"
          append_runner_temp_path "FUNDED_CANARY_CONTROLLER_BUNDLE_PATH" "sora-funded-canary-controller-bundle-v1.tar"
          append_runner_temp_path "FUNDED_CANARY_CONTROLLER_EVIDENCE_ROOT" "sora-funded-canary-controller-evidence-v1"
          append_runner_temp_path "FUNDED_CANARY_CONTROLLER_EXTRACTION_RECEIPT_PATH" "sora-funded-canary-controller-extraction-v1.json"

      - name: Admit independently signed dependency and signing review
        env:
          ANDROID_DEPENDENCY_SIGNING_REVIEW_MANIFEST_BASE64: ${{ secrets.ANDROID_DEPENDENCY_SIGNING_REVIEW_MANIFEST_BASE64 }}
          ANDROID_DEPENDENCY_SIGNING_REVIEW_PRODUCER_SIGNATURE_BASE64: ${{ secrets.ANDROID_DEPENDENCY_SIGNING_REVIEW_PRODUCER_SIGNATURE_BASE64 }}
          ANDROID_DEPENDENCY_SIGNING_REVIEW_REVIEWER_SIGNATURE_BASE64: ${{ secrets.ANDROID_DEPENDENCY_SIGNING_REVIEW_REVIEWER_SIGNATURE_BASE64 }}
          ANDROID_DEPENDENCY_SIGNING_REVIEW_PRODUCER_PUBLIC_KEY_BASE64: ${{ secrets.ANDROID_DEPENDENCY_SIGNING_REVIEW_PRODUCER_PUBLIC_KEY_BASE64 }}
          ANDROID_DEPENDENCY_SIGNING_REVIEW_REVIEWER_PUBLIC_KEY_BASE64: ${{ secrets.ANDROID_DEPENDENCY_SIGNING_REVIEW_REVIEWER_PUBLIC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$ANDROID_DEPENDENCY_SIGNING_REVIEW_PRODUCER_KEY_SHA256" =~ ^[0-9a-f]{64}$ && ! "$ANDROID_DEPENDENCY_SIGNING_REVIEW_PRODUCER_KEY_SHA256" =~ ^0+$ ]] || exit 1
          [[ "$ANDROID_DEPENDENCY_SIGNING_REVIEW_REVIEWER_KEY_SHA256" =~ ^[0-9a-f]{64}$ && ! "$ANDROID_DEPENDENCY_SIGNING_REVIEW_REVIEWER_KEY_SHA256" =~ ^0+$ ]] || exit 1
          [[ "$ANDROID_DEPENDENCY_SIGNING_REVIEW_PRODUCER_KEY_SHA256" != "$ANDROID_DEPENDENCY_SIGNING_REVIEW_REVIEWER_KEY_SHA256" ]] || exit 1
          [[ "$ANDROID_DEPENDENCY_SIGNING_REVIEW_SEQUENCE_NUMBER" =~ ^[1-9][0-9]{0,11}$ ]] || exit 1
          [[ "$ANDROID_DEPENDENCY_SIGNING_REVIEW_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ && "$ANDROID_DEPENDENCY_SIGNING_REVIEW_SOURCE_REVISION" = "$GITHUB_SHA" ]] || exit 1
          [[ "$ANDROID_DEPENDENCY_SIGNING_REVIEW_CONTRACT_SHA256" =~ ^[0-9a-f]{64}$ && ! "$ANDROID_DEPENDENCY_SIGNING_REVIEW_CONTRACT_SHA256" =~ ^0+$ ]] || exit 1
          for value in \
            ANDROID_DEPENDENCY_SIGNING_REVIEW_MANIFEST_BASE64 \
            ANDROID_DEPENDENCY_SIGNING_REVIEW_PRODUCER_SIGNATURE_BASE64 \
            ANDROID_DEPENDENCY_SIGNING_REVIEW_REVIEWER_SIGNATURE_BASE64 \
            ANDROID_DEPENDENCY_SIGNING_REVIEW_PRODUCER_PUBLIC_KEY_BASE64 \
            ANDROID_DEPENDENCY_SIGNING_REVIEW_REVIEWER_PUBLIC_KEY_BASE64; do
            [[ -n "${!value}" && "${!value}" =~ ^([A-Za-z0-9+/]{4})*([A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$ ]] || exit 1
          done
          install -d -m 700 "$RUNNER_TEMP/sora-android-dependency-signing-review"
          printf '%s' "$ANDROID_DEPENDENCY_SIGNING_REVIEW_MANIFEST_BASE64" | base64 --decode > "$ANDROID_DEPENDENCY_SIGNING_REVIEW_MANIFEST_PATH"
          printf '%s' "$ANDROID_DEPENDENCY_SIGNING_REVIEW_PRODUCER_SIGNATURE_BASE64" | base64 --decode > "$ANDROID_DEPENDENCY_SIGNING_REVIEW_PRODUCER_SIGNATURE_PATH"
          printf '%s' "$ANDROID_DEPENDENCY_SIGNING_REVIEW_REVIEWER_SIGNATURE_BASE64" | base64 --decode > "$ANDROID_DEPENDENCY_SIGNING_REVIEW_REVIEWER_SIGNATURE_PATH"
          printf '%s' "$ANDROID_DEPENDENCY_SIGNING_REVIEW_PRODUCER_PUBLIC_KEY_BASE64" | base64 --decode > "$ANDROID_DEPENDENCY_SIGNING_REVIEW_PRODUCER_PUBLIC_KEY_PATH"
          printf '%s' "$ANDROID_DEPENDENCY_SIGNING_REVIEW_REVIEWER_PUBLIC_KEY_BASE64" | base64 --decode > "$ANDROID_DEPENDENCY_SIGNING_REVIEW_REVIEWER_PUBLIC_KEY_PATH"
          chmod 600 \
            "$ANDROID_DEPENDENCY_SIGNING_REVIEW_MANIFEST_PATH" \
            "$ANDROID_DEPENDENCY_SIGNING_REVIEW_PRODUCER_SIGNATURE_PATH" \
            "$ANDROID_DEPENDENCY_SIGNING_REVIEW_REVIEWER_SIGNATURE_PATH" \
            "$ANDROID_DEPENDENCY_SIGNING_REVIEW_PRODUCER_PUBLIC_KEY_PATH" \
            "$ANDROID_DEPENDENCY_SIGNING_REVIEW_REVIEWER_PUBLIC_KEY_PATH"
          review_epoch="$(date +%s)"
          export ANDROID_DEPENDENCY_SIGNING_REVIEW_EVALUATION_EPOCH_SECONDS="$review_epoch"
          node scripts/verify-android-dependency-signing-review.mjs \
            > "$ANDROID_DEPENDENCY_SIGNING_REVIEW_ADMISSION_PATH"
          chmod 600 "$ANDROID_DEPENDENCY_SIGNING_REVIEW_ADMISSION_PATH"
          echo "ANDROID_DEPENDENCY_SIGNING_REVIEW_EVALUATION_EPOCH_SECONDS=$review_epoch" >> "$GITHUB_ENV"

      - name: Dependency provenance preflight
        run: node scripts/verify-production-modernization.mjs --dependency-preflight

      - name: Admit operator-signed Taira epoch mapping
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT == '' }}
        env:
          TAIRA_DEPLOYMENT_MANIFEST_BASE64: ${{ secrets.TAIRA_DEPLOYMENT_MANIFEST_BASE64 }}
          TAIRA_DEPLOYMENT_OPERATOR_SIGNATURE_BASE64: ${{ secrets.TAIRA_DEPLOYMENT_OPERATOR_SIGNATURE_BASE64 }}
          TAIRA_DEPLOYMENT_REVIEWER_SIGNATURE_BASE64: ${{ secrets.TAIRA_DEPLOYMENT_REVIEWER_SIGNATURE_BASE64 }}
          TAIRA_DEPLOYMENT_OPERATOR_PUBLIC_KEY_BASE64: ${{ secrets.TAIRA_DEPLOYMENT_OPERATOR_PUBLIC_KEY_BASE64 }}
          TAIRA_DEPLOYMENT_REVIEWER_PUBLIC_KEY_BASE64: ${{ secrets.TAIRA_DEPLOYMENT_REVIEWER_PUBLIC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$RUNNER_TEMP/sora-taira-deployment"
          for value in \
            TAIRA_DEPLOYMENT_MANIFEST_BASE64 \
            TAIRA_DEPLOYMENT_OPERATOR_SIGNATURE_BASE64 \
            TAIRA_DEPLOYMENT_REVIEWER_SIGNATURE_BASE64 \
            TAIRA_DEPLOYMENT_OPERATOR_PUBLIC_KEY_BASE64 \
            TAIRA_DEPLOYMENT_REVIEWER_PUBLIC_KEY_BASE64; do
            [[ -n "${!value}" && "${!value}" =~ ^([A-Za-z0-9+/]{4})*([A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$ ]] || {
              echo "protected Taira deployment input is missing or non-canonical" >&2
              exit 1
            }
          done
          printf '%s' "$TAIRA_DEPLOYMENT_MANIFEST_BASE64" | base64 --decode > "$TAIRA_DEPLOYMENT_MANIFEST_PATH"
          printf '%s' "$TAIRA_DEPLOYMENT_OPERATOR_SIGNATURE_BASE64" | base64 --decode > "$TAIRA_DEPLOYMENT_OPERATOR_SIGNATURE_PATH"
          printf '%s' "$TAIRA_DEPLOYMENT_REVIEWER_SIGNATURE_BASE64" | base64 --decode > "$TAIRA_DEPLOYMENT_REVIEWER_SIGNATURE_PATH"
          printf '%s' "$TAIRA_DEPLOYMENT_OPERATOR_PUBLIC_KEY_BASE64" | base64 --decode > "$TAIRA_DEPLOYMENT_OPERATOR_PUBLIC_KEY_PATH"
          printf '%s' "$TAIRA_DEPLOYMENT_REVIEWER_PUBLIC_KEY_BASE64" | base64 --decode > "$TAIRA_DEPLOYMENT_REVIEWER_PUBLIC_KEY_PATH"
          chmod 600 \
            "$TAIRA_DEPLOYMENT_MANIFEST_PATH" \
            "$TAIRA_DEPLOYMENT_OPERATOR_SIGNATURE_PATH" \
            "$TAIRA_DEPLOYMENT_REVIEWER_SIGNATURE_PATH" \
            "$TAIRA_DEPLOYMENT_OPERATOR_PUBLIC_KEY_PATH" \
            "$TAIRA_DEPLOYMENT_REVIEWER_PUBLIC_KEY_PATH"
          RELEASE_EVALUATION_EPOCH_SECONDS="$(date +%s)"
          export RELEASE_EVALUATION_EPOCH_SECONDS
          node scripts/verify-taira-deployment-manifest.mjs > "$TAIRA_DEPLOYMENT_ADMISSION_RECEIPT_PATH"
          chmod 600 "$TAIRA_DEPLOYMENT_ADMISSION_RECEIPT_PATH"
          node --input-type=module - "$TAIRA_DEPLOYMENT_ADMISSION_RECEIPT_PATH" "$GITHUB_ENV" <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const receipt = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const entries = {
            TAIRA_DEPLOYMENT_MANIFEST_SHA256: receipt.manifestSha256,
            TAIRA_DEPLOYMENT_MANIFEST_SEQUENCE_NUMBER: receipt.manifestSequenceNumber,
            TAIRA_CURRENT_EPOCH: receipt.current.epoch,
            TAIRA_CURRENT_CHAIN_ID: receipt.current.chainId,
            TAIRA_CURRENT_GENESIS_SHA256: receipt.current.genesisSha256,
            TAIRA_CURRENT_I105_DISCRIMINANT: receipt.current.i105Discriminant,
            TAIRA_CURRENT_TORII_BASE_URL: receipt.current.toriiBaseUrl,
            TAIRA_CURRENT_PUBLIC_MCP_ENDPOINT: receipt.current.publicNodeMcpEndpoint,
            TAIRA_CURRENT_EXPLORER_BASE_URL: receipt.current.explorerBaseUrl,
            TAIRA_RETIRED_EPOCH: receipt.retired.epoch,
            TAIRA_RETIRED_CHAIN_ID: receipt.retired.chainId,
            TAIRA_RETIRED_GENESIS_SHA256: receipt.retired.genesisSha256,
            TAIRA_DEPLOYMENT_OPERATOR_KEY_SHA256: receipt.operatorKeySha256,
            TAIRA_DEPLOYMENT_REVIEWER_KEY_SHA256: receipt.reviewerKeySha256,
          };
          for (const [key, value] of Object.entries(entries)) {
            const rendered = String(value);
            if (!/^[A-Za-z0-9._:/-]+$/.test(rendered) || rendered.includes("\n")) process.exit(1);
            appendFileSync(process.argv[3], `${key}=${rendered}\n`, { encoding: "utf8" });
          }
          NODE

      - name: Validate reviewed iOS parity source
        env:
          POLKAMARKT_IOS_READ_TOKEN: ${{ secrets.POLKAMARKT_IOS_READ_TOKEN }}
        run: |
          [[ -n "$POLKAMARKT_IOS_READ_TOKEN" ]] || {
            echo "read-only iOS parity checkout token is missing" >&2
            exit 1
          }
          [[ "$POLKAMARKT_IOS_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ && ! "$POLKAMARKT_IOS_REPOSITORY" =~ (^|/)\.{1,2}($|/) ]] || {
            echo "protected iOS parity repository is missing or non-canonical" >&2
            exit 1
          }
          [[ "$POLKAMARKT_IOS_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ && ! "$POLKAMARKT_IOS_SOURCE_REVISION" =~ ^0+$ ]] || {
            echo "protected iOS parity source revision is missing or non-canonical" >&2
            exit 1
          }

      - name: Checkout reviewed iOS parity fixture
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ vars.POLKAMARKT_IOS_REPOSITORY }}
          ref: ${{ vars.POLKAMARKT_IOS_SOURCE_REVISION }}
          token: ${{ secrets.POLKAMARKT_IOS_READ_TOKEN }}
          path: .cross-platform/sora-ios
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: Fixtures/Modernization/polkamarkt-runtime-v130.json
          sparse-checkout-cone-mode: false

      - name: Bind iOS parity fixture to reviewed source
        run: |
          observed_revision="$(git -C "$GITHUB_WORKSPACE/.cross-platform/sora-ios" rev-parse --verify HEAD)"
          [[ "$observed_revision" == "$POLKAMARKT_IOS_SOURCE_REVISION" ]] || {
            echo "checked-out iOS parity source revision changed" >&2
            exit 1
          }
          [[ -f "$POLKAMARKT_IOS_FIXTURE_PATH" && ! -L "$POLKAMARKT_IOS_FIXTURE_PATH" ]] || {
            echo "reviewed iOS parity fixture is missing or symbolic" >&2
            exit 1
          }

      - name: Validate immutable candidate reference
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT != '' }}
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          [[ "$PRODUCTION_ROLLOUT_TARGET_PERCENT" =~ ^(1|5|25|100)$ ]] || {
            echo "rollout target must be exactly 1, 5, 25, or 100" >&2
            exit 1
          }
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]{0,14}$ ]] || {
            echo "candidate_run_id is required for rollout and must be canonical decimal" >&2
            exit 1
          }

      - name: Download immutable qualified candidate
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sora-android-qualified-candidate
          path: ${{ runner.temp }}/qualified-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Normalize downloaded package to owner-only inputs
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT != '' }}
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/qualified-candidate"
          [[ -d "$package_root" && ! -L "$package_root" ]] || exit 1
          mapfile -d '' package_files < <(
            find "$package_root" -mindepth 1 -maxdepth 1 -type f -print0
          )
          [[ ${#package_files[@]} -eq 30 ]] || exit 1
          chmod 700 "$package_root"
          chmod 600 "${package_files[@]}"

      - name: Fetch immutable candidate provenance
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT != '' }}
        env:
          GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          run_url="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCTION_CANDIDATE_RUN_ID"
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail-with-body \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --max-filesize 262144 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GITHUB_API_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$PRODUCTION_CANDIDATE_RUN_RECEIPT_PATH" \
            "$run_url"
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail-with-body \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --max-filesize 262144 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GITHUB_API_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$PRODUCTION_CANDIDATE_ARTIFACT_RECEIPT_PATH" \
            "$run_url/artifacts?per_page=100"

      - name: Bind downloaded candidate to this source revision
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT != '' }}
        run: |
          source_file="$RUNNER_TEMP/qualified-candidate/source-revision.txt"
          [[ -f "$source_file" && ! -L "$source_file" ]] || {
            echo "qualified candidate source revision is missing" >&2
            exit 1
          }
          mapfile -t source_lines < "$source_file"
          [[ ${#source_lines[@]} -eq 1 && ${source_lines[0]} =~ ^[0-9a-f]{40}$ ]] || {
            echo "qualified candidate source revision is non-canonical" >&2
            exit 1
          }
          [[ "${source_lines[0]}" == "$GITHUB_SHA" ]] || {
            echo "workflow source differs from the immutable candidate source" >&2
            exit 1
          }
          {
            printf '%s\n' "PRODUCTION_CANDIDATE_SOURCE_REVISION=${source_lines[0]}"
            printf '%s\n' "PRODUCTION_CANDIDATE_AAB_PATH=$RUNNER_TEMP/qualified-candidate/candidate.aab"
            printf '%s\n' "PRODUCTION_QUALIFICATION_RECEIPT_PATH=$RUNNER_TEMP/qualified-candidate/production-admission.json"
            printf '%s\n' "PRODUCTION_CANDIDATE_PI_RECEIPT_PATH=$RUNNER_TEMP/qualified-candidate/candidate-pi-receipt.json"
          } >> "$GITHUB_ENV"

      - name: Validate complete downloaded reproducibility package
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT != '' }}
        env:
          PRODUCTION_DOWNLOADED_CANDIDATE_PACKAGE_ROOT: ${{ runner.temp }}/qualified-candidate
        run: |
          node scripts/verify-downloaded-android-qualified-candidate-package.mjs \
            > "$RUNNER_TEMP/sora-android-downloaded-candidate-validation.json"

      - name: Live PI production contract (read-only)
        run: node scripts/probe-pi-production-contract.mjs > "$PI_PRODUCTION_PROBE_RECEIPT"

      - name: Static production source gates
        run: node scripts/verify-production-modernization.mjs

      - name: Production rollout v3 envelope contract
        run: node scripts/test-production-rollout-v3-contract.mjs

      - name: Android migration v7/v2 evidence contracts
        run: |
          node scripts/test-android-migration-raw-evidence-v1.mjs
          node scripts/test-android-migration-qualification-v7-contract.mjs
          node scripts/test-android-migration-controller-envelope-v1.mjs

      - name: Taira deployment epoch manifest contract
        run: node scripts/test-taira-deployment-manifest-v1.mjs

      - name: Reproducible candidate package and signing contracts
        run: |
          node scripts/test-android-dependency-signing-review-v1.mjs
          node scripts/test-android-candidate-signing-verification-v1.mjs
          node scripts/test-android-qualified-candidate-package-v1.mjs

      - name: Funded Nexus canary v4 hermetic contract
