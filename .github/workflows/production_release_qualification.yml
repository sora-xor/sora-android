          test "$(git -C "$repro_root" rev-parse --verify HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C "$repro_root" status --porcelain=v1 --untracked-files=all)"

      - name: Reproduce reviewed Room 74, 75, 76, and 77 schemas
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT == '' }}
        run: |
          cp core_db/schemas/jp.co.soramitsu.core_db.AppDatabase/74.json "$RUNNER_TEMP/AppDatabase-74.reviewed.json"
          cp core_db/schemas/jp.co.soramitsu.core_db.AppDatabase/75.json "$RUNNER_TEMP/AppDatabase-75.reviewed.json"
          cp core_db/schemas/jp.co.soramitsu.core_db.AppDatabase/76.json "$RUNNER_TEMP/AppDatabase-76.reviewed.json"
          cp core_db/schemas/jp.co.soramitsu.core_db.AppDatabase/77.json "$RUNNER_TEMP/AppDatabase-77.reviewed.json"
          node scripts/verify-production-modernization.mjs --dependency-preflight
          ./gradlew \
