            --stacktrace --no-daemon --no-parallel
          node scripts/verify-production-modernization.mjs --dependency-preflight
          ./gradlew \
            :core_db:kspProductionDebugAndroidTestKotlin \
            --stacktrace --no-daemon --no-parallel
          cmp "$RUNNER_TEMP/AppDatabase-74.reviewed.json" core_db/schemas/jp.co.soramitsu.core_db.AppDatabase/74.json
          cmp "$RUNNER_TEMP/AppDatabase-75.reviewed.json" core_db/schemas/jp.co.soramitsu.core_db.AppDatabase/75.json
          cmp "$RUNNER_TEMP/AppDatabase-76.reviewed.json" core_db/schemas/jp.co.soramitsu.core_db.AppDatabase/76.json
          cmp "$RUNNER_TEMP/AppDatabase-77.reviewed.json" core_db/schemas/jp.co.soramitsu.core_db.AppDatabase/77.json
          cmp \
            core_db/schemas/jp.co.soramitsu.core_db.AppDatabase/74.json \
            core_db/schemas/jp.co.soramitsu.core_db.AppDatabaseV74SchemaFixture/74.json
          cmp \
            core_db/schemas/jp.co.soramitsu.core_db.AppDatabase/75.json \
            core_db/schemas/jp.co.soramitsu.core_db.AppDatabaseV75SchemaFixture/75.json
          cmp \
            core_db/schemas/jp.co.soramitsu.core_db.AppDatabase/76.json \
            core_db/schemas/jp.co.soramitsu.core_db.AppDatabaseV76SchemaFixture/76.json

      - name: Retained Room and encrypted-wallet backup matrix
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT == '' }}
        # This reruns only the source-side fixture tests. It does not consume retained
        # release-produced snapshots, preserve raw transcripts, or create/upgrade any signed
        # migration evidence or receipt.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
