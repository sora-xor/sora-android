            :feature_select_node_impl:testProductionDebugUnitTest \
            :feature_sora_card_api:testProductionDebugUnitTest \
            :feature_sora_card_impl:testProductionDebugUnitTest \
            :feature_wallet_api:testProductionDebugUnitTest \
            :feature_wallet_impl:testProductionDebugUnitTest \
            :network:testProductionDebugUnitTest \
            :sorasubstrate:testProductionDebugUnitTest \
            :test_data:testProductionDebugUnitTest \
            --stacktrace --no-daemon

      - name: Qualified production bundle
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT == '' }}
        env:
          CI_KEYSTORE_PATH: ${{ secrets.CI_KEYSTORE_PATH }}
          CI_KEYSTORE_PASS: ${{ secrets.CI_KEYSTORE_PASS }}
          CI_KEYSTORE_KEY_ALIAS: ${{ secrets.CI_KEYSTORE_KEY_ALIAS }}
          CI_KEYSTORE_KEY_PASS: ${{ secrets.CI_KEYSTORE_KEY_PASS }}
        run: |
          set -o pipefail
          node scripts/verify-production-modernization.mjs --dependency-preflight
          ./gradlew \
            :app:verifyProductionReleaseSigning \
            :app:testProductionReleaseUnitTest \
            :app:lintProductionRelease \
            :app:assembleProductionRelease \
            :app:bundleProductionRelease \
            --stacktrace --no-daemon 2>&1 | tee "$PRODUCTION_PRIMARY_BUILD_LOG_PATH"
          test -s "$PRODUCTION_CANDIDATE_AAB_PATH"
          test ! -L "$PRODUCTION_CANDIDATE_AAB_PATH"
          test -s "$PRODUCTION_CANDIDATE_MAPPING_PATH"
          test ! -L "$PRODUCTION_CANDIDATE_MAPPING_PATH"
          test -s "$PRODUCTION_CANDIDATE_APK_PATH"
          test ! -L "$PRODUCTION_CANDIDATE_APK_PATH"
          test -s "$PRODUCTION_PRIMARY_BUILD_LOG_PATH"
          test ! -L "$PRODUCTION_PRIMARY_BUILD_LOG_PATH"

      - name: Verify exact primary candidate signing identity
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT == '' }}
        run: |
          PRODUCTION_JARSIGNER_PATH="$(realpath "$JAVA_HOME/bin/jarsigner")" \
          PRODUCTION_KEYTOOL_PATH="$(realpath "$JAVA_HOME/bin/keytool")" \
          PRODUCTION_APKSIGNER_PATH="$(realpath "$ANDROID_HOME/build-tools/36.0.0/apksigner")" \
            node scripts/verify-android-candidate-signing.mjs \
              > "$PRODUCTION_PRIMARY_SIGNING_VERIFICATION_PATH"
          observed_upload_certificate="$(
            node -e \
              'const fs=require("node:fs");const v=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(v.signingIdentity.observedUploadCertificateSha256);' \
              "$PRODUCTION_PRIMARY_SIGNING_VERIFICATION_PATH"
          )"
          [[ "$observed_upload_certificate" =~ ^[0-9a-f]{64}$ ]] || {
            echo "observed upload certificate digest is invalid" >&2
            exit 1
          }
          echo "PRODUCTION_OBSERVED_UPLOAD_CERTIFICATE_SHA256=$observed_upload_certificate" >> "$GITHUB_ENV"

      - name: Independently rebuild and compare production candidate
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT == '' }}
        env:
          CI_KEYSTORE_PATH: ${{ secrets.CI_KEYSTORE_PATH }}
          CI_KEYSTORE_PASS: ${{ secrets.CI_KEYSTORE_PASS }}
          CI_KEYSTORE_KEY_ALIAS: ${{ secrets.CI_KEYSTORE_KEY_ALIAS }}
          CI_KEYSTORE_KEY_PASS: ${{ secrets.CI_KEYSTORE_KEY_PASS }}
        run: |
          set -o pipefail
          repro_root="$RUNNER_TEMP/sora-android-reproduction"
          export GRADLE_USER_HOME="$RUNNER_TEMP/sora-android-reproduction-gradle-home"
          cd "$repro_root"
          node scripts/verify-production-modernization.mjs --dependency-preflight
          ./gradlew \
            :app:verifyProductionReleaseSigning \
            :app:testProductionReleaseUnitTest \
            :app:lintProductionRelease \
            :app:assembleProductionRelease \
            :app:bundleProductionRelease \
            --stacktrace --no-daemon 2>&1 | tee "$PRODUCTION_REPRODUCED_BUILD_LOG_PATH"
          test -s "$PRODUCTION_REPRODUCED_AAB_PATH"
          test ! -L "$PRODUCTION_REPRODUCED_AAB_PATH"
          test -s "$PRODUCTION_REPRODUCED_APK_PATH"
          test ! -L "$PRODUCTION_REPRODUCED_APK_PATH"
          test -s "$PRODUCTION_REPRODUCED_MAPPING_PATH"
          test ! -L "$PRODUCTION_REPRODUCED_MAPPING_PATH"
          test -s "$PRODUCTION_REPRODUCED_BUILD_LOG_PATH"
          test ! -L "$PRODUCTION_REPRODUCED_BUILD_LOG_PATH"
          PRODUCTION_CANDIDATE_AAB_PATH="$PRODUCTION_REPRODUCED_AAB_PATH" \
          PRODUCTION_CANDIDATE_APK_PATH="$PRODUCTION_REPRODUCED_APK_PATH" \
          PRODUCTION_JARSIGNER_PATH="$(realpath "$JAVA_HOME/bin/jarsigner")" \
          PRODUCTION_KEYTOOL_PATH="$(realpath "$JAVA_HOME/bin/keytool")" \
          PRODUCTION_APKSIGNER_PATH="$(realpath "$ANDROID_HOME/build-tools/36.0.0/apksigner")" \
            node scripts/verify-android-candidate-signing.mjs \
              > "$PRODUCTION_REPRODUCED_SIGNING_VERIFICATION_PATH"
          cmp "$PRODUCTION_CANDIDATE_AAB_PATH" "$PRODUCTION_REPRODUCED_AAB_PATH"
          cmp "$PRODUCTION_CANDIDATE_APK_PATH" "$PRODUCTION_REPRODUCED_APK_PATH"
          cmp "$PRODUCTION_CANDIDATE_MAPPING_PATH" "$PRODUCTION_REPRODUCED_MAPPING_PATH"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          git -C "$GITHUB_WORKSPACE" diff --exit-code
          test -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain=v1 --untracked-files=no)"

      - name: Minified signed production APK device smoke
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT == '' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            release_apk="app/build/outputs/apk/production/release/app-production-release.apk"
            test -s "$release_apk"
            test ! -L "$release_apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
              verify --verbose --print-certs "$release_apk"
            adb install --no-streaming "$release_apk"
            adb shell am force-stop jp.co.soramitsu.sora
            adb shell am start -W \
              -n jp.co.soramitsu.sora/.splash.presentation.SplashActivity
            adb shell pidof jp.co.soramitsu.sora

      - name: Obtain exact retained-device migration evidence
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT == '' }}
        env:
          ANDROID_MIGRATION_CONTROLLER_TOKEN: ${{ secrets.ANDROID_MIGRATION_CONTROLLER_TOKEN }}
        run: |
          [[ "$ANDROID_MIGRATION_CONTROLLER_ORIGIN" =~ ^https://[A-Za-z0-9.-]+(:[1-9][0-9]{0,4})?$ ]] || {
            echo "protected Android migration controller origin is missing or invalid" >&2
            exit 1
          }
          [[ "$ANDROID_MIGRATION_CONTROLLER_TLS_SPKI_SHA256_BASE64" =~ ^[A-Za-z0-9+/]{43}=$ ]] || {
            echo "protected Android migration controller TLS SPKI pin is missing or invalid" >&2
            exit 1
          }
          [[ -n "$ANDROID_MIGRATION_CONTROLLER_TOKEN" && ${#ANDROID_MIGRATION_CONTROLLER_TOKEN} -le 4096 && "$ANDROID_MIGRATION_CONTROLLER_TOKEN" != *$'\r'* && "$ANDROID_MIGRATION_CONTROLLER_TOKEN" != *$'\n'* ]] || {
            echo "protected Android migration controller token is missing or unsafe" >&2
            exit 1
          }
          [[ "$ANDROID_MIGRATION_QUALIFICATION_RUN_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ && "$ANDROID_MIGRATION_QUALIFICATION_RUN_ID" != 00000000-0000-0000-0000-000000000000 ]] || {
            echo "protected Android migration run ID is missing or invalid" >&2
            exit 1
          }
          [[ "$ANDROID_MIGRATION_QUALIFICATION_SEQUENCE_NUMBER" =~ ^[1-9][0-9]{0,14}$ ]] || {
            echo "protected Android migration sequence is missing or invalid" >&2
            exit 1
          }
          [[ "$ANDROID_MIGRATION_QUALIFICATION_APP_BUILD_IDENTITY_SHA256" =~ ^[0-9a-f]{64}$ && ! "$ANDROID_MIGRATION_QUALIFICATION_APP_BUILD_IDENTITY_SHA256" =~ ^0+$ ]] || {
            echo "protected Android migration app-build identity is missing or invalid" >&2
            exit 1
          }
          candidate_sha256="$(sha256sum "$PRODUCTION_CANDIDATE_AAB_PATH" | awk '{print $1}')"
          candidate_bytes="$(stat --format='%s' "$PRODUCTION_CANDIDATE_AAB_PATH")"
          [[ "$candidate_sha256" =~ ^[0-9a-f]{64}$ && "$candidate_bytes" =~ ^[1-9][0-9]{0,9}$ ]] || {
            echo "candidate identity is invalid before retained-device evidence handoff" >&2
            exit 1
          }
          umask 077
          # Retrieval is single-shot and candidate/run idempotent. The protected
          # authority owns retained snapshots, devices, signing, and review keys.
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --pinnedpubkey "sha256//$ANDROID_MIGRATION_CONTROLLER_TLS_SPKI_SHA256_BASE64" \
            --fail-with-body \
            --silent \
            --show-error \
            --connect-timeout 15 \
            --max-time 7200 \
            --max-filesize 33554432 \
            --request POST \
            --header "Authorization: Bearer $ANDROID_MIGRATION_CONTROLLER_TOKEN" \
            --header 'Content-Type: application/vnd.android.aab' \
            --header 'Accept: application/vnd.sora.android-migration-envelope-v1+json' \
            --header 'X-SORA-Contract: sora-android-migration-controller-v1' \
            --header "X-SORA-Candidate-SHA256: $candidate_sha256" \
            --header "X-SORA-Candidate-Bytes: $candidate_bytes" \
            --header "X-SORA-Source-Revision: $PRODUCTION_CANDIDATE_SOURCE_REVISION" \
            --header "X-SORA-Migration-Run-ID: $ANDROID_MIGRATION_QUALIFICATION_RUN_ID" \
            --header "X-SORA-Migration-Sequence: $ANDROID_MIGRATION_QUALIFICATION_SEQUENCE_NUMBER" \
            --header "X-SORA-App-Build-Identity-SHA256: $ANDROID_MIGRATION_QUALIFICATION_APP_BUILD_IDENTITY_SHA256" \
            --header "X-SORA-Idempotency-Key: android-migration-$candidate_sha256-$ANDROID_MIGRATION_QUALIFICATION_RUN_ID" \
            --data-binary "@$PRODUCTION_CANDIDATE_AAB_PATH" \
            --output "$ANDROID_MIGRATION_CONTROLLER_ENVELOPE_PATH" \
            "$ANDROID_MIGRATION_CONTROLLER_ORIGIN/v1/android/migration-qualification/evidence-envelope"

      - name: Extract and bind retained-device migration evidence
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT == '' }}
        run: |
          node scripts/extract-android-migration-controller-envelope.mjs \
            > "$ANDROID_MIGRATION_CONTROLLER_EXTRACTION_RECEIPT_PATH"
          evidence_root="$ANDROID_MIGRATION_CONTROLLER_EVIDENCE_ROOT"
          qualification_root="$GITHUB_WORKSPACE/docs/modernization/qualification"
          for file in \
            android-migration-matrix.json \
            android-migration-evidence.json \
            android-migration-trust.json \
            android-migration-retained-snapshot-manifest.json \
            android-migration-test-results.json \
            android-migration-encrypted-storage-evidence.json \
            android-migration-device-execution-evidence.json \
            android-migration-raw-execution-evidence.json
          do
            test ! -e "$qualification_root/$file"
            install -m 400 "$evidence_root/$file" "$qualification_root/$file"
          done
          {
            echo "ANDROID_MIGRATION_QUALIFICATION_RECEIPT_SIGNATURE_PATH=$evidence_root/android-migration-receipt-signature.der"
            echo "ANDROID_MIGRATION_QUALIFICATION_EVIDENCE_PRODUCER_SIGNATURE_PATH=$evidence_root/android-migration-evidence-producer-signature.der"
            echo "ANDROID_MIGRATION_QUALIFICATION_EVIDENCE_REVIEWER_SIGNATURE_PATH=$evidence_root/android-migration-evidence-reviewer-signature.der"
            echo "ANDROID_MIGRATION_QUALIFICATION_DEVICE_PRODUCER_PUBLIC_KEY_PATH=$evidence_root/device-producer-public-key.pem"
            echo "ANDROID_MIGRATION_QUALIFICATION_REVIEWER_PUBLIC_KEY_PATH=$evidence_root/reviewer-public-key.pem"
          } >> "$GITHUB_ENV"

      - name: Refresh live PI contract before funded canaries
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT == '' }}
        run: node scripts/probe-pi-production-contract.mjs > "$PI_PRODUCTION_PROBE_RECEIPT"

      - name: Record explicit pre-canary evaluation epoch
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT == '' }}
        run: echo "PRODUCTION_RELEASE_EVALUATED_AT_EPOCH_SECONDS=$(date +%s)" >> "$GITHUB_ENV"

      - name: Exact pre-canary prerequisite gate
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT == '' }}
        run: node scripts/verify-production-modernization.mjs --pre-canary

      - name: Run protected candidate-bound funded canaries
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT == '' }}
        env:
          FUNDED_CANARY_CONTROLLER_TOKEN: ${{ secrets.FUNDED_CANARY_CONTROLLER_TOKEN }}
        run: |
          [[ "$FUNDED_CANARY_CONTROLLER_ORIGIN" =~ ^https://[A-Za-z0-9.-]+(:[1-9][0-9]{0,4})?$ ]] || {
            echo "protected funded-canary controller origin is missing or invalid" >&2
            exit 1
          }
          [[ "$FUNDED_CANARY_CONTROLLER_TLS_SPKI_SHA256_BASE64" =~ ^[A-Za-z0-9+/]{43}=$ ]] || {
            echo "protected funded-canary controller TLS SPKI pin is missing or invalid" >&2
            exit 1
          }
          [[ -n "$FUNDED_CANARY_CONTROLLER_TOKEN" && ${#FUNDED_CANARY_CONTROLLER_TOKEN} -le 4096 && "$FUNDED_CANARY_CONTROLLER_TOKEN" != *$'\r'* && "$FUNDED_CANARY_CONTROLLER_TOKEN" != *$'\n'* ]] || {
            echo "protected funded-canary controller token is missing or unsafe" >&2
            exit 1
          }
          candidate_sha256="$(sha256sum "$PRODUCTION_CANDIDATE_AAB_PATH" | awk '{print $1}')"
          candidate_bytes="$(stat --format='%s' "$PRODUCTION_CANDIDATE_AAB_PATH")"
          [[ "$candidate_sha256" =~ ^[0-9a-f]{64}$ && "$candidate_bytes" =~ ^[1-9][0-9]{0,9}$ ]] || {
            echo "candidate identity is invalid before funded canary handoff" >&2
            exit 1
          }
          umask 077
          # This mutation-capable request is deliberately single-shot. The protected
          # controller and its signed consumption ledger enforce no duplicate submission.
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --pinnedpubkey "sha256//$FUNDED_CANARY_CONTROLLER_TLS_SPKI_SHA256_BASE64" \
            --fail-with-body \
            --silent \
            --show-error \
            --connect-timeout 15 \
            --max-time 7200 \
            --max-filesize 5368709120 \
            --request POST \
            --header "Authorization: Bearer $FUNDED_CANARY_CONTROLLER_TOKEN" \
            --header 'Content-Type: application/vnd.android.aab' \
            --header 'Accept: application/x-ustar' \
            --header 'X-SORA-Contract: sora-android-funded-canary-controller-v1' \
            --header "X-SORA-Candidate-SHA256: $candidate_sha256" \
            --header "X-SORA-Candidate-Bytes: $candidate_bytes" \
            --header "X-SORA-Source-Revision: $PRODUCTION_CANDIDATE_SOURCE_REVISION" \
            --header "X-SORA-Idempotency-Key: android-$candidate_sha256" \
            --header "X-SORA-Qualification-Run: $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --data-binary "@$PRODUCTION_CANDIDATE_AAB_PATH" \
            --output "$FUNDED_CANARY_CONTROLLER_BUNDLE_PATH" \
            "$FUNDED_CANARY_CONTROLLER_ORIGIN/v1/android/funded-canary/evidence-bundle"

      - name: Extract exact funded-canary evidence bundle
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT == '' }}
        run: |
          node scripts/extract-funded-canary-controller-bundle.mjs \
            > "$FUNDED_CANARY_CONTROLLER_EXTRACTION_RECEIPT_PATH"
          evidence_root="$FUNDED_CANARY_CONTROLLER_EVIDENCE_ROOT"
          {
            echo "PRODUCTION_CANDIDATE_APKS_PATH=$evidence_root/candidate.apks"
            echo "PRODUCTION_BUNDLETOOL_JAR_PATH=$evidence_root/bundletool.jar"
            echo "IROHA_REVIEWED_FINALITY_VERIFIER_ARTIFACT_PATH=$evidence_root/iroha-finality-verifier.artifact"
            echo "IROHA_REVIEWED_FINALITY_PLATFORM_ARTIFACT_PATH=$evidence_root/iroha-finality-platform.artifact"
            echo "IROHA_REVIEWED_FINALITY_NATIVE_CANARY_RECEIPT_PATH=$evidence_root/iroha-native-finality-canary.json"
            echo "PRODUCTION_FINALITY_TRUST_MANIFEST_RECEIPT=$evidence_root/production-finality-trust-manifest.json"
            echo "TAIRA_FUNDED_CANARY_RECEIPT_PATH=$evidence_root/taira-canary.json"
            echo "TAIRA_FUNDED_CANARY_APPROVAL_RECEIPT=$evidence_root/taira-approval.json"
            echo "TAIRA_FUNDED_CANARY_LOW_VALUE_POLICY=$evidence_root/taira-low-value-policy.json"
            echo "TAIRA_FUNDED_CANARY_PI_RECEIPT=$evidence_root/taira-pi-receipt.json"
            echo "TAIRA_FUNDED_CANARY_ARTIFACT_IDENTITY_RECEIPT=$evidence_root/taira-artifact-identity.json"
            echo "TAIRA_FUNDED_CANARY_FINALITY_TRUST_CONTEXT=$evidence_root/taira-finality-trust-context.json"
            echo "TAIRA_FUNDED_CANARY_CONSUMPTION_RECEIPT=$evidence_root/taira-consumption-receipt.json"
            echo "TAIRA_FUNDED_CANARY_EVIDENCE_BUNDLE=$evidence_root/taira-evidence-bundle.json"
            echo "MINAMOTO_FUNDED_CANARY_RECEIPT_PATH=$evidence_root/minamoto-canary.json"
            echo "MINAMOTO_FUNDED_CANARY_APPROVAL_RECEIPT=$evidence_root/minamoto-approval.json"
            echo "MINAMOTO_FUNDED_CANARY_LOW_VALUE_POLICY=$evidence_root/minamoto-low-value-policy.json"
            echo "MINAMOTO_FUNDED_CANARY_PI_RECEIPT=$evidence_root/minamoto-pi-receipt.json"
            echo "MINAMOTO_FUNDED_CANARY_ARTIFACT_IDENTITY_RECEIPT=$evidence_root/minamoto-artifact-identity.json"
            echo "MINAMOTO_FUNDED_CANARY_FINALITY_TRUST_CONTEXT=$evidence_root/minamoto-finality-trust-context.json"
            echo "MINAMOTO_FUNDED_CANARY_CONSUMPTION_RECEIPT=$evidence_root/minamoto-consumption-receipt.json"
            echo "MINAMOTO_FUNDED_CANARY_EVIDENCE_BUNDLE=$evidence_root/minamoto-evidence-bundle.json"
          } >> "$GITHUB_ENV"

      - name: Refresh live PI contract after funded canaries
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT == '' }}
        run: node scripts/probe-pi-production-contract.mjs > "$PI_PRODUCTION_PROBE_RECEIPT"

      - name: Record explicit release evaluation epoch
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT == '' }}
        run: echo "PRODUCTION_RELEASE_EVALUATED_AT_EPOCH_SECONDS=$(date +%s)" >> "$GITHUB_ENV"

      - name: Exact built-candidate production gates
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT == '' }}
        run: |
          set -o pipefail
          node scripts/verify-production-modernization.mjs --release | tee "$PRODUCTION_QUALIFICATION_RECEIPT_PATH"

      - name: Seal immutable qualified-candidate package
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT == '' }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/qualified-candidate"
          install -m 400 "$PRODUCTION_CANDIDATE_AAB_PATH" "$RUNNER_TEMP/qualified-candidate/candidate.aab"
          install -m 400 "$PRODUCTION_CANDIDATE_APK_PATH" "$RUNNER_TEMP/qualified-candidate/candidate.apk"
          install -m 400 "$PRODUCTION_CANDIDATE_MAPPING_PATH" "$RUNNER_TEMP/qualified-candidate/r8-mapping.txt"
          install -m 400 "$PRODUCTION_REPRODUCED_AAB_PATH" "$RUNNER_TEMP/qualified-candidate/reproduced-candidate.aab"
          install -m 400 "$PRODUCTION_REPRODUCED_APK_PATH" "$RUNNER_TEMP/qualified-candidate/reproduced-candidate.apk"
          install -m 400 "$PRODUCTION_REPRODUCED_MAPPING_PATH" "$RUNNER_TEMP/qualified-candidate/reproduced-r8-mapping.txt"
          install -m 400 "$PRODUCTION_PRIMARY_BUILD_LOG_PATH" "$RUNNER_TEMP/qualified-candidate/primary-build.log"
          install -m 400 "$PRODUCTION_REPRODUCED_BUILD_LOG_PATH" "$RUNNER_TEMP/qualified-candidate/reproduction-build.log"
          install -m 400 "$PRODUCTION_PRIMARY_SIGNING_VERIFICATION_PATH" "$RUNNER_TEMP/qualified-candidate/primary-signing-verification.json"
          install -m 400 "$PRODUCTION_REPRODUCED_SIGNING_VERIFICATION_PATH" "$RUNNER_TEMP/qualified-candidate/reproduction-signing-verification.json"
          install -m 400 "$ANDROID_MIGRATION_CONTROLLER_ENVELOPE_PATH" "$RUNNER_TEMP/qualified-candidate/android-migration-controller-envelope-v1.json"
          install -m 400 "$ANDROID_MIGRATION_CONTROLLER_EXTRACTION_RECEIPT_PATH" "$RUNNER_TEMP/qualified-candidate/android-migration-controller-extraction-v1.json"
          install -m 400 "$TAIRA_DEPLOYMENT_MANIFEST_PATH" "$RUNNER_TEMP/qualified-candidate/taira-deployment-manifest.json"
          install -m 400 "$TAIRA_DEPLOYMENT_OPERATOR_SIGNATURE_PATH" "$RUNNER_TEMP/qualified-candidate/taira-deployment-operator.sig"
          install -m 400 "$TAIRA_DEPLOYMENT_REVIEWER_SIGNATURE_PATH" "$RUNNER_TEMP/qualified-candidate/taira-deployment-reviewer.sig"
          install -m 400 "$TAIRA_DEPLOYMENT_OPERATOR_PUBLIC_KEY_PATH" "$RUNNER_TEMP/qualified-candidate/taira-deployment-operator.pem"
          install -m 400 "$TAIRA_DEPLOYMENT_REVIEWER_PUBLIC_KEY_PATH" "$RUNNER_TEMP/qualified-candidate/taira-deployment-reviewer.pem"
          install -m 400 "$TAIRA_DEPLOYMENT_ADMISSION_RECEIPT_PATH" "$RUNNER_TEMP/qualified-candidate/taira-deployment-admission.json"
          install -m 400 "$ANDROID_DEPENDENCY_SIGNING_REVIEW_MANIFEST_PATH" "$RUNNER_TEMP/qualified-candidate/android-dependency-signing-review-manifest.json"
          install -m 400 "$ANDROID_DEPENDENCY_SIGNING_REVIEW_PRODUCER_SIGNATURE_PATH" "$RUNNER_TEMP/qualified-candidate/android-dependency-signing-review-producer.sig"
          install -m 400 "$ANDROID_DEPENDENCY_SIGNING_REVIEW_REVIEWER_SIGNATURE_PATH" "$RUNNER_TEMP/qualified-candidate/android-dependency-signing-review-reviewer.sig"
          install -m 400 "$ANDROID_DEPENDENCY_SIGNING_REVIEW_PRODUCER_PUBLIC_KEY_PATH" "$RUNNER_TEMP/qualified-candidate/android-dependency-signing-review-producer.pem"
          install -m 400 "$ANDROID_DEPENDENCY_SIGNING_REVIEW_REVIEWER_PUBLIC_KEY_PATH" "$RUNNER_TEMP/qualified-candidate/android-dependency-signing-review-reviewer.pem"
          install -m 400 "$ANDROID_DEPENDENCY_SIGNING_REVIEW_ADMISSION_PATH" "$RUNNER_TEMP/qualified-candidate/android-dependency-signing-review-admission.json"
          install -m 400 "$FUNDED_CANARY_CONTROLLER_BUNDLE_PATH" "$RUNNER_TEMP/qualified-candidate/funded-canary-controller-bundle-v1.tar"
          install -m 400 "$FUNDED_CANARY_CONTROLLER_EXTRACTION_RECEIPT_PATH" "$RUNNER_TEMP/qualified-candidate/funded-canary-controller-extraction-v1.json"
          install -m 400 "$PRODUCTION_QUALIFICATION_RECEIPT_PATH" "$RUNNER_TEMP/qualified-candidate/production-admission.json"
          install -m 400 "$PRODUCTION_CANDIDATE_PI_RECEIPT_PATH" "$RUNNER_TEMP/qualified-candidate/candidate-pi-receipt.json"
          node scripts/create-android-qualified-candidate-package.mjs \
            > "$RUNNER_TEMP/qualified-candidate/candidate-package-manifest.json"
          chmod 400 "$RUNNER_TEMP/qualified-candidate/candidate-package-manifest.json"
          printf '%s\n' "$PRODUCTION_CANDIDATE_SOURCE_REVISION" > "$RUNNER_TEMP/qualified-candidate/source-revision.txt"
          chmod 400 "$RUNNER_TEMP/qualified-candidate/source-revision.txt"

      - name: Publish immutable qualified candidate
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT == '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sora-android-qualified-candidate
          path: |
            ${{ runner.temp }}/qualified-candidate/candidate.aab
            ${{ runner.temp }}/qualified-candidate/candidate.apk
            ${{ runner.temp }}/qualified-candidate/r8-mapping.txt
            ${{ runner.temp }}/qualified-candidate/reproduced-candidate.aab
            ${{ runner.temp }}/qualified-candidate/reproduced-candidate.apk
            ${{ runner.temp }}/qualified-candidate/reproduced-r8-mapping.txt
            ${{ runner.temp }}/qualified-candidate/primary-build.log
            ${{ runner.temp }}/qualified-candidate/reproduction-build.log
            ${{ runner.temp }}/qualified-candidate/primary-signing-verification.json
            ${{ runner.temp }}/qualified-candidate/reproduction-signing-verification.json
            ${{ runner.temp }}/qualified-candidate/android-migration-controller-envelope-v1.json
            ${{ runner.temp }}/qualified-candidate/android-migration-controller-extraction-v1.json
            ${{ runner.temp }}/qualified-candidate/taira-deployment-manifest.json
            ${{ runner.temp }}/qualified-candidate/taira-deployment-operator.sig
            ${{ runner.temp }}/qualified-candidate/taira-deployment-reviewer.sig
            ${{ runner.temp }}/qualified-candidate/taira-deployment-operator.pem
            ${{ runner.temp }}/qualified-candidate/taira-deployment-reviewer.pem
            ${{ runner.temp }}/qualified-candidate/taira-deployment-admission.json
            ${{ runner.temp }}/qualified-candidate/android-dependency-signing-review-manifest.json
            ${{ runner.temp }}/qualified-candidate/android-dependency-signing-review-producer.sig
            ${{ runner.temp }}/qualified-candidate/android-dependency-signing-review-reviewer.sig
            ${{ runner.temp }}/qualified-candidate/android-dependency-signing-review-producer.pem
            ${{ runner.temp }}/qualified-candidate/android-dependency-signing-review-reviewer.pem
            ${{ runner.temp }}/qualified-candidate/android-dependency-signing-review-admission.json
            ${{ runner.temp }}/qualified-candidate/funded-canary-controller-bundle-v1.tar
            ${{ runner.temp }}/qualified-candidate/funded-canary-controller-extraction-v1.json
            ${{ runner.temp }}/qualified-candidate/production-admission.json
            ${{ runner.temp }}/qualified-candidate/candidate-pi-receipt.json
            ${{ runner.temp }}/qualified-candidate/candidate-package-manifest.json
            ${{ runner.temp }}/qualified-candidate/source-revision.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Record explicit rollout evaluation epoch
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT != '' }}
        run: echo "PRODUCTION_ROLLOUT_EVALUATED_AT_EPOCH_SECONDS=$(date +%s)" >> "$GITHUB_ENV"

      - name: Create privacy-safe rollout controller request
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT != '' }}
        run: node scripts/create-production-rollout-controller-request.mjs > "$RUNNER_TEMP/sora-production-rollout-request.json"

      - name: Obtain signed rollout evidence from protected controller
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT != '' }}
        env:
          ROLLOUT_CONTROLLER_TOKEN: ${{ secrets.PRODUCTION_ROLLOUT_CONTROLLER_TOKEN }}
        run: |
          [[ "$PRODUCTION_ROLLOUT_CONTROLLER_ORIGIN" =~ ^https://[A-Za-z0-9.-]+(:[1-9][0-9]{0,4})?$ ]] || {
            echo "protected rollout controller origin is missing or invalid" >&2
            exit 1
          }
          [[ "$PRODUCTION_ROLLOUT_CONTROLLER_TLS_SPKI_SHA256_BASE64" =~ ^[A-Za-z0-9+/]{43}=$ ]] || {
            echo "protected rollout controller TLS SPKI pin is missing or invalid" >&2
            exit 1
          }
          [[ -n "$ROLLOUT_CONTROLLER_TOKEN" && ${#ROLLOUT_CONTROLLER_TOKEN} -le 4096 && "$ROLLOUT_CONTROLLER_TOKEN" != *$'\r'* && "$ROLLOUT_CONTROLLER_TOKEN" != *$'\n'* ]] || {
            echo "protected rollout controller token is missing or unsafe" >&2
            exit 1
          }
          umask 077
          # The v3 wire contract is intentionally fail-closed. Do not retry a
          # missing v3 deployment against the incompatible v2 controller API.
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --pinnedpubkey "sha256//$PRODUCTION_ROLLOUT_CONTROLLER_TLS_SPKI_SHA256_BASE64" \
            --fail-with-body \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            --max-filesize 65536 \
            --request POST \
            --header "Authorization: Bearer $ROLLOUT_CONTROLLER_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/sora-production-rollout-request.json" \
            --output "$PRODUCTION_ROLLOUT_EVIDENCE_PATH" \
            "$PRODUCTION_ROLLOUT_CONTROLLER_ORIGIN/v3/android/rollout/evidence"
          cursor_path="$PRODUCTION_ROLLOUT_EVIDENCE_PATH"
          cursor_target="$PRODUCTION_ROLLOUT_TARGET_PERCENT"
          while [[ "$cursor_target" != 1 ]]; do
            case "$cursor_target" in
              5) prior_target=1 ;;
              25) prior_target=5 ;;
              100) prior_target=25 ;;
              *) echo "invalid rollout chain target" >&2; exit 1 ;;
            esac
            prior_hash="$(
              PRODUCTION_ROLLOUT_CHAIN_CURSOR_PATH="$cursor_path" \
              PRODUCTION_ROLLOUT_CHAIN_CURSOR_TARGET="$cursor_target" \
              node scripts/extract-production-rollout-prior-link.mjs
            )"
            [[ "$prior_hash" =~ ^[0-9a-f]{64}$ ]] || {
              echo "rollout chain link is non-canonical" >&2
              exit 1
            }
            prior_path="$RUNNER_TEMP/sora-production-rollout-receipt-$prior_target.json"
            curl \
              --proto '=https' \
              --tlsv1.2 \
              --pinnedpubkey "sha256//$PRODUCTION_ROLLOUT_CONTROLLER_TLS_SPKI_SHA256_BASE64" \
              --fail-with-body \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 60 \
              --max-filesize 65536 \
              --header "Authorization: Bearer $ROLLOUT_CONTROLLER_TOKEN" \
              --output "$prior_path" \
              "$PRODUCTION_ROLLOUT_CONTROLLER_ORIGIN/v3/android/rollout/receipts/sha256/$prior_hash"
            echo "PRODUCTION_ROLLOUT_RECEIPT_${prior_target}_PATH=$prior_path" >> "$GITHUB_ENV"
            cursor_path="$prior_path"
            cursor_target="$prior_target"
          done
          terminal_link="$(
            PRODUCTION_ROLLOUT_CHAIN_CURSOR_PATH="$cursor_path" \
            PRODUCTION_ROLLOUT_CHAIN_CURSOR_TARGET=1 \
            node scripts/extract-production-rollout-prior-link.mjs
          )"
          [[ "$terminal_link" == NONE ]] || {
            echo "initial rollout receipt does not terminate the chain" >&2
            exit 1
          }

      - name: Exact built-candidate staged-rollout gate
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT != '' }}
        run: node scripts/verify-production-rollout.mjs

      - name: Retain validated rollout receipt
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sora-android-rollout-${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT }}-receipt
          path: |
            ${{ runner.temp }}/sora-production-*rollout*.json
            ${{ runner.temp }}/sora-android-downloaded-candidate-validation.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
