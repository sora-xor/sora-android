      - name: Set up JDK
        if: ${{ env.PRODUCTION_ROLLOUT_TARGET_PERCENT == '' }}
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
